<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>DA BOYZ Draft Assistant</title>
<style>html,body{margin:0;background:#0e1118;color:#f4f6fb;font-family:Arial,sans-serif}.load{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.load b{font-size:22px}.load small{display:block;color:#9ba8bd;margin-top:8px;line-height:1.4}</style>
</head>
<body>
<div class="load" id="load"><div><b>DA BOYZ Draft Assistant</b><small>Loading v0.13.0…</small></div></div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js').catch(()=>{})}
(async()=>{try{if(typeof DecompressionStream==='undefined')throw new Error('Use current Chrome.');const r=await fetch('./app.html.gz');if(!r.ok)throw new Error('app.html.gz: '+r.status);const text=await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text();const layers='<script src="./simulation-calibration.js"></scr'+'ipt><script src="./interpretation-layer.js"></scr'+'ipt><script src="./affinity-tracker.js"></scr'+'ipt>';const enhanced=text.includes('</body>')?text.replace('</body>',layers+'</body>'):text+layers;document.open();document.write(enhanced);document.close()}catch(err){document.getElementById('load').innerHTML='<div><b>Could not load the draft assistant.</b><small>'+String(err)+'</small><small>Reload once online. After the PWA cache is installed it will work offline.</small></div>'}})();
</script>
</body>
</html>
